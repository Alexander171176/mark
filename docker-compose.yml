
services:

    # ==========================================
    # Nginx Web Server
    # ==========================================
    webserver:
        image: nginx:alpine
        container_name: mark-webserver
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/
            - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
            - ./storage/docker/logs/nginx/:/var/log/nginx
        depends_on:
            - app
        networks:
            - mark-webserver-network

    # ==========================================
    # PHP Application
    # ==========================================
    app:
        build:
            context: ./
            dockerfile: ./docker/php/Dockerfile
        container_name: mark-php-app
        restart: unless-stopped
        working_dir: /var/www
        user: "${UID}:${GID}"

        volumes:
            - ./:/var/www/
            - ./docker/php/extend-php.ini:/usr/local/etc/php/conf.d/extend-php.ini

        environment:
            HOME: /var/www
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379

        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy

        networks:
            - mark-db-network
            - mark-webserver-network

    # ==========================================
    # MySQL 8
    # ==========================================
    db:
        image: mysql:8.0
        container_name: mark-db
        restart: unless-stopped

        # Только для подключения с локального компьютера
        ports:
            - "127.0.0.1:3306:3306"

        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}

        volumes:
            - ./storage/docker/_mysql:/var/lib/mysql

        networks:
            - mark-db-network

    # ==========================================
    # phpMyAdmin
    # ==========================================
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: mark-phpmyadmin
        restart: unless-stopped

        ports:
            - "127.0.0.1:8081:80"

        environment:
            PMA_HOST: ${DB_HOST}
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}

        depends_on:
            - db

        networks:
            - mark-db-network
            - mark-webserver-network

    # ==========================================
    # Redis
    # ==========================================
    redis:
        image: redis:7-alpine
        container_name: mark-redis
        restart: unless-stopped

        command:
            - redis-server
            - --appendonly
            - "yes"

        volumes:
            - redis-data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5

        networks:
            - mark-db-network

    # ==========================================
    # Laravel Queue Worker
    # ==========================================
    queue:
        build:
            context: ./
            dockerfile: ./docker/php/Dockerfile

        container_name: mark-queue-worker
        restart: unless-stopped
        working_dir: /var/www
        user: "${UID}:${GID}"

        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=default
            - --sleep=3
            - --tries=3
            - --backoff=10
            - --timeout=60
            - --max-time=3600

        stop_grace_period: 90s

        volumes:
            - ./:/var/www/
            - ./docker/php/extend-php.ini:/usr/local/etc/php/conf.d/extend-php.ini

        environment:
            HOME: /var/www
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379

        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy

        networks:
            - mark-db-network
            - mark-webserver-network

    # ==========================================
    # Laravel Email Queue Worker
    # ==========================================
    email-queue:
        build:
            context: ./
            dockerfile: ./docker/php/Dockerfile

        container_name: mark-email-worker
        restart: unless-stopped
        working_dir: /var/www
        user: "${UID}:${GID}"

        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=emails
            - --sleep=3
            - --tries=3
            - --backoff=10
            - --timeout=60
            - --max-time=3600

        stop_grace_period: 90s

        volumes:
            - ./:/var/www/
            - ./docker/php/extend-php.ini:/usr/local/etc/php/conf.d/extend-php.ini

        environment:
            HOME: /var/www
            DB_CONNECTION: ${DB_CONNECTION}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            QUEUE_CONNECTION: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379

        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy

        networks:
            - mark-db-network
            - mark-webserver-network

    # ==========================================
    # Memcached
    # ==========================================
    memcached:
        image: memcached:1.6-alpine
        container_name: mark-memcached
        restart: unless-stopped

        networks:
            - mark-db-network
            - mark-webserver-network

    # ==========================================
    # Mailpit - локальное тестирование Email
    # ==========================================
    mailpit:
        image: axllent/mailpit:latest
        container_name: mark-mailpit
        restart: unless-stopped

        ports:
            - "127.0.0.1:8025:8025"

        networks:
            - mark-webserver-network

# ==========================================
# Docker Networks
# ==========================================
networks:
    mark-webserver-network:
    mark-db-network:

# ==========================================
# Docker Volumes
# ==========================================
volumes:
    redis-data:
